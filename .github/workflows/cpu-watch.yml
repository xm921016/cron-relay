name: cpu-watch

# Worker CPU 异常预警（2026-10-22 新增，2026-11-18 改 Paid 口径）。
# 每天北京时间 10:10 查一次 cron-relay / dingzhi 两个 Worker 最近 24 小时的 CPU 分位。
# 账号 2026-11-16 起为 Workers Paid（单请求 CPU 上限 30 秒），旧 9.5ms 阈值天天误报已废；
# 现告警条件：①24h 错误数 ≥3（真在挂）②p50 ≥100ms 且比前 7 天均值恶化 50%（真在变坏）。
# 手动触发可勾选 force：不看阈值强制发一封，用来验证通道。

on:
  # 2026-11-24 定时迁 CF：原 GitHub schedule 已删，由 relay-watchdog 发令表准点 workflow_dispatch（详 cron-relay/watchdog/relay_watchdog.js SCHED_TABLE）
  workflow_dispatch:
    inputs:
      force:
        description: "强制发信（通道自测）"
        required: false
        default: "false"

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check worker cpu
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          CPU_THRESH_MS: '100'
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python cpu_watch.py --force
          else
            python cpu_watch.py
          fi
